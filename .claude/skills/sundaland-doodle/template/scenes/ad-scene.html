<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      @font-face { font-family: "InkHand"; src: url("assets/patrickhand.ttf") format("truetype"); font-display: block; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; }
      /* AnimatedDrawings clips are rendered on pure white: multiply makes the white vanish on the white page */
      .vid { position: absolute; top: 18px; width: 920px; height: 1035px; mix-blend-mode: multiply; transform-origin: 50% 85%; opacity: 0; }
      .shadow { position: absolute; top: 884px; width: 240px; height: 30px; border-radius: 50%;
                background: radial-gradient(ellipse at center, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0) 70%); opacity: 0; }
      .cap { position: absolute; left: 0; top: 66px; width: 1920px; text-align: center; font-family: "InkHand", cursive;
             font-size: 80px; color: #2a2a2a; opacity: 0; }
      #signActor { position: absolute; left: 1170px; top: 360px; width: 324px; height: 563px; transform-origin: 50% 100%; opacity: 0; }
      #signActor img { position: absolute; inset: 0; width: 100%; height: 100%; }
      #signText { position: absolute; left: 22px; top: 27px; width: 274px; height: 165px; display: flex; flex-direction: column;
                  align-items: center; justify-content: center; font-family: "InkHand", cursive; font-size: 46px; line-height: 0.95;
                  color: #1a1a1a; opacity: 0; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.93" data-width="1920" data-height="1080">
      <div id="shadowC" class="shadow" style="left:840px"></div>
      <div id="shadowL" class="shadow" style="left:640px"></div>
      <video id="v1" class="vid" src="assets/b1_hi.mp4" muted playsinline data-start="0" data-duration="2.533" data-track-index="2" style="left:392px"></video>
      <video id="v2" class="vid" src="assets/b2_jump.mp4" muted playsinline data-start="2.533" data-duration="1.633" data-track-index="3" style="left:392px"></video>
      <video id="v3" class="vid" src="assets/b3_jacks.mp4" muted playsinline data-start="4.166" data-duration="3.033" data-track-index="4" style="left:392px"></video>
      <video id="v4" class="vid" src="assets/b4_dance.mp4" muted playsinline data-start="7.2" data-duration="3.5" data-track-index="5" style="left:392px"></video>
      <video id="v5" class="vid" src="assets/b5_cheer.mp4" muted playsinline data-start="10.7" data-duration="4.233" data-track-index="6" style="left:192px"></video>
      <div id="signActor"><img src="assets/sign.png" alt="sign" /><div id="signText"><div>THE</div><div>SUNDALAND</div></div></div>
      <div id="c1" class="cap">Hi from The Sundaland!</div>
      <div id="c2" class="cap">Ships are coming in!</div>
      <div id="c3" class="cap">warm-up before the cargo...</div>
      <div id="c4" class="cap">party at the port!</div>
      <div id="flash"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      if (document.fonts && document.fonts.load) { document.fonts.load("80px InkHand"); }
      var tl = gsap.timeline({ paused: true });
      function overshoot(p) { var z = 0.35, w = 13; return p >= 1 ? 1 : 1 - Math.exp(-z * w * p) * Math.cos(w * Math.sqrt(1 - z * z) * p); }

      // each beat: show its clip on cut with a little pop (hides the pose jump between mocap clips)
      var beats = [["#v1", 0, 2.533], ["#v2", 2.533, 4.166], ["#v3", 4.166, 7.2], ["#v4", 7.2, 10.7], ["#v5", 10.7, 14.933]];
      beats.forEach(function (b, i) {
        tl.set(b[0], { opacity: 1 }, b[1]);
        tl.fromTo(b[0], { scale: i === 0 ? 0.2 : 0.9 }, { scale: 1, duration: i === 0 ? 0.5 : 0.28, ease: overshoot, immediateRender: false }, b[1]);
        if (i < beats.length - 1) tl.set(b[0], { opacity: 0 }, b[2]);
      });
      tl.fromTo("#shadowC", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.15);
      tl.set("#shadowC", { opacity: 0 }, 10.7);
      tl.set("#shadowL", { opacity: 1 }, 10.7);

      [["#c1", 0.25, 2.35], ["#c2", 2.6, 4.05], ["#c3", 4.25, 7.05], ["#c4", 7.3, 10.55]].forEach(function (c) {
        tl.fromTo(c[0], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, c[1]);
        tl.to(c[0], { opacity: 0, duration: 0.2 }, c[2]);
        tl.set(c[0], { opacity: 0 }, c[2] + 0.2);
      });

      // finale: the sign-holder pops in beside the cheering character
      tl.fromTo("#signActor", { opacity: 1, scale: 0 }, { opacity: 1, scale: 1, duration: 0.45, ease: overshoot, immediateRender: false }, 11.0);
      tl.fromTo("#signText", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: overshoot }, 11.5);
      tl.fromTo("#signActor", { y: 0 }, { y: -16, duration: 0.2, ease: "power1.out", yoyo: true, repeat: 5, immediateRender: false }, 11.6);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.85, duration: 0.06 }, 13.3);
      tl.to("#flash", { opacity: 0, duration: 0.4 }, 13.36);
      tl.set("#flash", { opacity: 0 }, 13.8);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
